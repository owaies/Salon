name: Salon Validation Tests

on:
  push:
    branches: [main]
    paths:
      - 'server/app.js'
      - 'server/validation.js'
      - 'server/tests/**'
      - 'server/package.json'
      - '.github/workflows/salon-validation-tests.yml'
  pull_request:
    paths:
      - 'server/app.js'
      - 'server/validation.js'
      - 'server/tests/**'
      - 'server/package.json'
      - '.github/workflows/salon-validation-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run database-free validation tests
        run: npm test --prefix server
